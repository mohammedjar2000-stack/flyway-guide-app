# Local PostGIS for Flyway Guide phase-1 GIS (Istanbul).
# Does not replace the existing Vite/Supabase frontend data sources.

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: flyway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - flyway_postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flyway"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flyway_postgis:
